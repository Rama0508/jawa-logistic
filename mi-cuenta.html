<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Mi cuenta — Jawa Logistic</title>
<meta name="theme-color" content="#16223d" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 236 236'%3E%3Ccircle cx='118' cy='118' r='106' fill='%23ffffff' stroke='%2316223d' stroke-width='10'/%3E%3Crect x='88' y='88' width='60' height='60' fill='%23c9502e' transform='rotate(45 118 118)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="page-bg" aria-hidden="true"></div>

<div class="navbar">
  <div class="navbar-inner">
    <a class="brand" href="index.html">
      <div class="logo-box">
        <svg class="compass-mark" viewBox="0 0 200 200" width="34" height="34">
          <circle class="ring" cx="100" cy="100" r="92"/>
          <polygon class="facet-coral-l" points="100,100 100,15 121,79"/>
          <polygon class="facet-coral-d" points="100,100 100,15 79,79"/>
          <polygon class="facet-navy-l" points="100,100 121,79 185,100"/>
          <polygon class="facet-navy-d" points="100,100 185,100 121,121"/>
          <polygon class="facet-navy-l" points="100,100 121,121 100,185"/>
          <polygon class="facet-navy-d" points="100,100 100,185 79,121"/>
          <polygon class="facet-navy-l" points="100,100 79,121 15,100"/>
          <polygon class="facet-navy-d" points="100,100 15,100 79,79"/>
          <circle class="core" cx="100" cy="100" r="7"/>
        </svg>
      </div>
      <div class="brand-name">Jawa Logistic</div>
    </a>
    <div class="nav-links" id="nav-links">
      <a href="tienda.html">Tienda</a>
      <a href="cursos.html">Cursos</a>
      <a href="index.html#como-funciona">Importaciones</a>
      <a href="mi-cuenta.html"><strong>Mi cuenta</strong></a>
      <a class="nav-cart" href="carrito.html" aria-label="Ver carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cart-count" style="display:none;">0</span>
      </a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-links">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</div>

<main>
  <section class="section">
    <div class="wrap">

      <!-- ---------- No logueado: login / registro ---------- -->
      <div id="cuenta-anonima" style="display:none; max-width:420px; margin:0 auto;">
        <div class="section-head reveal">
          <div class="eyebrow">Mi cuenta</div>
          <h2 id="cuenta-titulo">Ingresá a tu cuenta</h2>
        </div>
        <div class="cuenta-form">
          <div id="cuenta-nombre-field" style="display:none;">
            <label>Nombre</label>
            <input type="text" id="cuenta-nombre" placeholder="Tu nombre" />
          </div>
          <label>Email</label>
          <input type="email" id="cuenta-email" placeholder="tuemail@ejemplo.com" />
          <label>Contraseña</label>
          <input type="password" id="cuenta-password" placeholder="••••••••" />
          <div id="cuenta-error" class="link-box-error" style="margin-top:10px;"></div>
          <div id="cuenta-info" class="link-box-error" style="margin-top:10px; background:#eef7f0; border-color:#bfe3c8; color:#1c6b34; display:none;"></div>
          <button class="btn-primary" id="cuenta-submit-btn" type="button" style="width:100%; justify-content:center; margin-top:14px;">Ingresar</button>
          <p style="text-align:center; font-size:12.5px; margin-top:16px; color:var(--muted);">
            <a href="#" id="cuenta-toggle-modo">¿No tenés cuenta? Registrate</a>
          </p>
        </div>
      </div>

      <!-- ---------- Logueado: panel de cuenta ---------- -->
      <div id="cuenta-logueada" style="display:none;">
        <div class="section-head reveal">
          <div class="eyebrow">Mi cuenta</div>
          <h2>Hola, <span id="cuenta-email-actual"></span></h2>
          <p><a href="#" id="cuenta-logout">Cerrar sesión</a></p>
        </div>

        <h3 style="margin-top:30px;">Mis pedidos</h3>
        <div id="pedidos-vacio" style="display:none; color:var(--muted); font-size:13px;">Todavía no hiciste ningún pedido.</div>
        <div id="pedidos-lista" class="pedidos-lista"></div>

        <h3 style="margin-top:40px;">Mis cursos</h3>
        <div id="cursos-vacio" style="display:none; color:var(--muted); font-size:13px;">Todavía no compraste ningún curso.</div>
        <div id="cursos-lista" class="catalogo-grid"></div>
      </div>

    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="footer-bottom">© <span id="anio-actual"></span> Jawa Logistic. Todos los derechos reservados.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/rates.js"></script>
<script src="js/tienda.js"></script>
<script src="js/cuenta.js"></script>
<script>
document.getElementById("anio-actual").textContent = new Date().getFullYear();
document.getElementById("nav-toggle").addEventListener("click", () => {
  const links = document.getElementById("nav-links");
  const open = links.classList.toggle("open");
  document.getElementById("nav-toggle").setAttribute("aria-expanded", open ? "true" : "false");
});

try {
  (async function () {
    await SUPABASE_READY;

    let modoRegistro = false;
    const toggleBtn = document.getElementById("cuenta-toggle-modo");
    toggleBtn.addEventListener("click", (e) => {
      e.preventDefault();
      modoRegistro = !modoRegistro;
      document.getElementById("cuenta-titulo").textContent = modoRegistro ? "Creá tu cuenta" : "Ingresá a tu cuenta";
      document.getElementById("cuenta-nombre-field").style.display = modoRegistro ? "block" : "none";
      document.getElementById("cuenta-submit-btn").textContent = modoRegistro ? "Crear cuenta" : "Ingresar";
      toggleBtn.textContent = modoRegistro ? "¿Ya tenés cuenta? Ingresá" : "¿No tenés cuenta? Registrate";
      document.getElementById("cuenta-error").classList.remove("show");
      document.getElementById("cuenta-info").style.display = "none";
    });

    document.getElementById("cuenta-submit-btn").addEventListener("click", async () => {
      const email = document.getElementById("cuenta-email").value.trim();
      const password = document.getElementById("cuenta-password").value;
      const nombre = document.getElementById("cuenta-nombre").value.trim();
      const errEl = document.getElementById("cuenta-error");
      const infoEl = document.getElementById("cuenta-info");
      errEl.classList.remove("show");
      infoEl.style.display = "none";
      if (!email || !password) return;

      const resultado = modoRegistro
        ? await registrarCliente(email, password, nombre)
        : await iniciarSesionCliente(email, password);

      if (!resultado.ok) {
        errEl.textContent = resultado.error;
        errEl.classList.add("show");
        return;
      }
      if (resultado.necesitaConfirmacion) {
        infoEl.textContent = "Te mandamos un email para confirmar tu cuenta — revisalo antes de ingresar.";
        infoEl.style.display = "block";
        return;
      }
      mostrarSegunSesion(await obtenerSesionActual());
    });

    document.getElementById("cuenta-logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await cerrarSesionCliente();
      mostrarSegunSesion(null);
    });

    async function mostrarSegunSesion(session) {
      document.getElementById("cuenta-anonima").style.display = session ? "none" : "block";
      document.getElementById("cuenta-logueada").style.display = session ? "block" : "none";
      if (!session) return;

      document.getElementById("cuenta-email-actual").textContent = session.user.email;

      const params = new URLSearchParams(location.search);
      const volver = params.get("volver");
      if (volver) { location.href = volver; return; }

      const { data: pedidos } = await supabaseClient
        .from("pedidos")
        .select("id, estado, total_centavos, creado_en")
        .order("creado_en", { ascending: false });
      const listaPedidos = document.getElementById("pedidos-lista");
      if (!pedidos || !pedidos.length) {
        document.getElementById("pedidos-vacio").style.display = "block";
      } else {
        listaPedidos.innerHTML = pedidos.map((p) => `
          <div class="pedido-row">
            <span class="data">#${p.id.slice(0, 8)}</span>
            <span>${new Date(p.creado_en).toLocaleDateString("es-AR")}</span>
            <span class="pedido-estado pedido-estado-${p.estado}">${p.estado}</span>
            <span class="data">${fmtCentavos(p.total_centavos)}</span>
          </div>
        `).join("");
      }

      const { data: inscripciones } = await supabaseClient
        .from("inscripciones")
        .select("producto_id, productos(id, nombre, slug, imagenes)")
        .order("creado_en", { ascending: false });
      const listaCursos = document.getElementById("cursos-lista");
      if (!inscripciones || !inscripciones.length) {
        document.getElementById("cursos-vacio").style.display = "block";
      } else {
        listaCursos.innerHTML = inscripciones.map((i) => {
          const c = i.productos;
          if (!c) return "";
          return `
            <a class="catalogo-card" href="curso.html?slug=${encodeURIComponent(c.slug)}">
              <div class="catalogo-img">
                ${primeraImagen(c) ? `<img src="${primeraImagen(c)}" alt="${c.nombre}" loading="lazy" />` : `<div class="catalogo-img-vacio">Sin imagen</div>`}
              </div>
              <div class="catalogo-info">
                <div class="catalogo-nombre">${c.nombre}</div>
                <div class="catalogo-precio">Ver contenido →</div>
              </div>
            </a>
          `;
        }).join("");
      }
    }

    mostrarSegunSesion(await obtenerSesionActual());
  })();
} catch (e) { console.error("mi cuenta:", e); }
</script>
</body>
</html>
