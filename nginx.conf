server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en las respuestas.
    server_tokens off;

    # Cabeceras de seguridad básicas — protegen contra clickjacking, MIME
    # sniffing y filtración de referrer, sin afectar ninguna funcionalidad
    # del sitio (no agregamos Content-Security-Policy todavía porque varias
    # páginas usan <script> inline; se puede sumar más adelante con cuidado
    # de no romper nada).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        # Mismo comportamiento que el default.conf de nginx:alpine (el que
        # ya estaba en uso) — no cambiamos ruteo, solo agregamos cabeceras.
        index index.html index.htm;
    }
}
