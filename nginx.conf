# Rate limiting básico a nivel de este servidor nginx (la parte del stack
# que sí controlamos directamente — las Edge Functions/DB de Supabase
# tienen sus propios límites, esto no los reemplaza). Por IP: hasta ~15
# pedidos/seg en régimen sostenido, con ráfaga de 40 sin cortar de golpe
# (una carga de página normal dispara varios pedidos de golpe: HTML, CSS,
# JS, imágenes — no queremos limitar a un visitante real, solo frenar un
# script/bot pegándole en loop a este servidor).
limit_req_zone $binary_remote_addr zone=general:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en las respuestas.
    server_tokens off;

    # Cabeceras de seguridad básicas — protegen contra clickjacking, MIME
    # sniffing y filtración de referrer, sin afectar ninguna funcionalidad
    # del sitio (no agregamos Content-Security-Policy todavía porque varias
    # páginas usan <script> inline; se puede sumar más adelante con cuidado
    # de no romper nada).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    limit_req zone=general burst=40 nodelay;
    limit_req_status 429;
    limit_conn conn_limit 30;
    limit_conn_status 429;

    # OJO nginx: si un "location" tiene CUALQUIER add_header propio, deja de
    # heredar los add_header del server — por eso las 4 cabeceras de
    # seguridad se repiten en cada bloque de abajo.

    location / {
        index index.html index.htm;

        # Sin esto, nginx no manda Cache-Control y los navegadores caen en
        # "caché heurística": se quedan con el HTML/JS viejo durante horas
        # aunque el server ya tenga el nuevo. Eso rompió el panel una vez
        # (rates.js viejo + admin.html nuevo) y dejó el PDF del informe
        # cortado (admin.html viejo). "no-cache" = el navegador SIEMPRE
        # revalida con el ETag; si el archivo no cambió, la respuesta es un
        # 304 mínimo, así que casi no cuesta y nunca queda una versión vieja.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    # Imágenes / fuentes: casi nunca cambian y no son las que rompen nada,
    # así que van con caché larga (1 semana) para no re-descargarlas siempre.
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot|pdf)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}
