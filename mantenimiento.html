<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jawa Logistic — Sitio en mantenimiento</title>
<meta name="description" content="El sitio de Jawa Logistic está en mantenimiento. Por el momento no estamos tomando pedidos." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#16223d" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 236 236'%3E%3Ccircle cx='118' cy='118' r='106' fill='%23ffffff' stroke='%2316223d' stroke-width='10'/%3E%3Crect x='88' y='88' width='60' height='60' fill='%23c9502e' transform='rotate(45 118 118)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root { --navy: #16223d; --rust: #c9502e; --paper: #f5f2ec; --ink: #1d2433; --muted: #5d6576; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; text-align: center;
  }
  .card {
    width: 100%; max-width: 560px; background: #fff; border-top: 6px solid var(--rust);
    border-radius: 6px; padding: 48px 32px 40px; box-shadow: 0 18px 50px rgba(22, 34, 61, .12);
  }
  .logo { width: 72px; height: 72px; margin: 0 auto 20px; }
  .brand { font-family: "Oswald", sans-serif; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); font-size: 15px; }
  h1 { font-family: "Oswald", sans-serif; font-weight: 700; color: var(--navy); font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 18px 0 16px; text-transform: uppercase; }
  p { color: var(--muted); font-size: 17px; line-height: 1.6; }
  p + p { margin-top: 12px; }
  .aviso { margin-top: 24px; padding: 14px 16px; background: rgba(201, 80, 46, .08); border-left: 4px solid var(--rust); color: var(--ink); font-weight: 500; text-align: left; font-size: 15px; }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 236 236" aria-hidden="true"><circle cx="118" cy="118" r="106" fill="#fff" stroke="#16223d" stroke-width="10"/><rect x="88" y="88" width="60" height="60" fill="#c9502e" transform="rotate(45 118 118)"/></svg>
    <div class="brand">Jawa Logistic</div>
    <h1>Sitio en mantenimiento</h1>
    <p>Estamos realizando tareas de mantenimiento y por el momento el sitio no está funcionando.</p>
    <p>Volveremos a estar disponibles pronto.</p>
    <div class="aviso">Mientras tanto no estamos tomando pedidos, cotizaciones ni compras.</div>
  </main>
  <footer>Web desarrollada por <a href="https://commit.ar" target="_blank" rel="noopener">COMMIT</a></footer>
</body>
</html>
