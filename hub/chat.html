<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Soporte — Portal de cliente — Jawa Logistic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 236 236'%3E%3Ccircle cx='118' cy='118' r='106' fill='%23ffffff' stroke='%2316223d' stroke-width='10'/%3E%3Crect x='88' y='88' width='60' height='60' fill='%23c9502e' transform='rotate(45 118 118)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
<link rel="stylesheet" href="../css/hub.css" />
</head>
<body>

<div id="hub-shell">
  <div id="hub-page">
    <p class="hub-page-lead">Escribile directo a nuestro equipo sobre tus importaciones.</p>
    <div class="hub-card">
      <div id="chat-box" class="hub-chat-box"><p class="hub-empty">Cargando…</p></div>
      <div class="hub-chat-input-row">
        <textarea id="chat-input" placeholder="Escribí tu mensaje…"></textarea>
        <button class="hub-btn-primary" id="chat-enviar-btn" type="button">Enviar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/rates.js"></script>
<script src="../js/cuenta.js"></script>
<script src="../js/hub.js"></script>
<script>
try {
  (async function () {
    const session = await iniciarHub("chat");
    if (!session) return;

    await SUPABASE_READY;
    const clienteId = session.user.id;

    const box = document.getElementById("chat-box");

    function renderMensaje(m) {
      const div = document.createElement("div");
      div.className = "hub-chat-msg " + (m.autor_rol === "cliente" ? "propio" : "ajeno");
      div.innerHTML = `
        <div class="autor">${m.autor_rol === "cliente" ? "Vos" : "Jawa Logistic"}</div>
        <div>${escHtml(m.mensaje)}</div>
        <div class="hora">${fmtFechaHora(m.creado_en)}</div>
      `;
      box.appendChild(div);
    }

    async function cargarHistorial() {
      const { data, error } = await supabaseClient
        .from("chat_mensajes")
        .select("id, autor_rol, mensaje, creado_en")
        .eq("cliente_id", clienteId)
        .order("creado_en", { ascending: true });
      box.innerHTML = "";
      if (error) { box.innerHTML = `<p class="hub-empty">Error: ${error.message}</p>`; return; }
      if (!data || !data.length) { box.innerHTML = `<p class="hub-empty">Todavía no escribiste a soporte. Contanos en qué te podemos ayudar.</p>`; return; }
      data.forEach(renderMensaje);
      box.scrollTop = box.scrollHeight;
    }

    async function enviar() {
      const input = document.getElementById("chat-input");
      const mensaje = input.value.trim();
      if (!mensaje) return;
      input.value = "";
      const { error } = await supabaseClient.from("chat_mensajes").insert({
        cliente_id: clienteId, autor_id: clienteId, autor_rol: "cliente", mensaje,
      });
      if (error) { alert("No se pudo enviar el mensaje: " + error.message); }
    }
    document.getElementById("chat-enviar-btn").addEventListener("click", enviar);
    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
    });

    await cargarHistorial();

    // Realtime: tanto los mensajes de soporte como el eco del propio mensaje
    // recién enviado llegan por acá — evita lógica optimista duplicada.
    supabaseClient
      .channel(`hub-chat-${clienteId}`)
      .on("postgres_changes", {
        event: "INSERT", schema: "public", table: "chat_mensajes", filter: `cliente_id=eq.${clienteId}`,
      }, (payload) => {
        renderMensaje(payload.new);
        box.scrollTop = box.scrollHeight;
        const vacio = box.querySelector(".hub-empty");
        if (vacio) vacio.remove();
      })
      .subscribe();
  })();
} catch (e) { console.error("chat hub:", e); }
</script>
</body>
</html>
