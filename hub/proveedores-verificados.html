<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Proveedores Verificados — Portal de cliente — Jawa Logistic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 236 236'%3E%3Ccircle cx='118' cy='118' r='106' fill='%23ffffff' stroke='%2316223d' stroke-width='10'/%3E%3Crect x='88' y='88' width='60' height='60' fill='%23c9502e' transform='rotate(45 118 118)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/hub.css" />
</head>
<body>

<div id="hub-shell">
  <div id="hub-page">
    <p class="hub-page-lead">Productos de proveedores para importar, con precio FOB. ¿No encontrás lo tuyo? Solicitalo y te lo conseguimos.</p>
    <div id="prov-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/rates.js"></script>
<script src="../js/cuenta.js"></script>
<script src="../js/hub.js"></script>
<script>
try {
  (async function () {
    await SUPABASE_READY;
    const session = await iniciarHub("proveedores-verificados");
    if (!session) return;

    const WA_NUMERO = "5493813312280";
    let productos = [];
    let categoriaActiva = "Todos";
    let busqueda = "";
    let detalleAbierto = null;

    function fmtFob(p) {
      const min = Number(p.precio_fob_min);
      const max = p.precio_fob_max != null ? Number(p.precio_fob_max) : null;
      if (max && max !== min) return `US$ ${min.toLocaleString("es-AR")} – US$ ${max.toLocaleString("es-AR")}`;
      return `US$ ${min.toLocaleString("es-AR")}`;
    }

    async function cargarProductos() {
      const { data, error } = await supabaseClient
        .from("proveedores_catalogo")
        .select("*")
        .eq("activo", true)
        .order("creado_en", { ascending: false });
      if (error) { console.error(error); return; }
      productos = data || [];
    }

    function categorias() {
      const set = new Set(productos.map((p) => p.categoria));
      return ["Todos", ...Array.from(set)];
    }

    function productosFiltrados() {
      return productos.filter((p) => {
        const coincideCategoria = categoriaActiva === "Todos" || p.categoria === categoriaActiva;
        const coincideBusqueda = !busqueda || (p.nombre + " " + p.categoria).toLowerCase().includes(busqueda.toLowerCase());
        return coincideCategoria && coincideBusqueda;
      });
    }

    function linkWa(mensaje) {
      return `https://wa.me/${WA_NUMERO}?text=${encodeURIComponent(mensaje)}`;
    }

    function renderTarjeta(p) {
      return `
        <div class="prov-card" data-detalle="${p.id}">
          <div class="prov-card-img">
            <span class="prov-badge ${p.verificado ? "si" : "no"}">${p.verificado ? "✓ Verificado" : "Ejemplo"}</span>
            ${p.imagen_url ? `<img src="${escHtml(p.imagen_url)}" alt="${escHtml(p.nombre)}" />` : "📦"}
          </div>
          <div class="prov-card-body">
            <div class="prov-card-cat">${escHtml(p.categoria)}</div>
            <div class="prov-card-nombre">${escHtml(p.nombre)}</div>
            <div class="prov-card-precio-lbl">Precio FOB · ${escHtml(p.origen)}</div>
            <div class="prov-card-precio">${fmtFob(p)}</div>
          </div>
        </div>
      `;
    }

    function renderDetalle(p) {
      if (!p) return "";
      return `
        <div class="prov-detail-overlay" id="prov-detail-overlay">
          <div class="prov-detail-card">
            <button class="prov-detail-close" id="prov-detail-close" type="button">✕</button>
            <div class="prov-detail-img">${p.imagen_url ? `<img src="${escHtml(p.imagen_url)}" alt="${escHtml(p.nombre)}" />` : "📦"}</div>
            <span class="prov-badge ${p.verificado ? "si" : "no"}" style="position:static; display:inline-block; margin-bottom:10px;">${p.verificado ? "✓ Verificado" : "Ejemplo — no verificado aún"}</span>
            <div class="prov-detail-cat">${escHtml(p.categoria)}</div>
            <div class="prov-detail-nombre">${escHtml(p.nombre)}</div>
            <div class="prov-detail-desc">${escHtml(p.descripcion || "Sin descripción todavía.")}</div>
            ${p.codigo_hs ? `<div style="font-size:11.5px; color:var(--muted); margin:-10px 0 14px;">Código HS/NCM <span class="hub-tooltip" tabindex="0" title="Es el código que clasifica el producto ante la aduana argentina — de él depende qué arancel se paga y qué permisos se necesitan. Si comprás un producto distinto, pedíselo siempre a tu proveedor (en Alibaba, 1688, etc. suele figurar como &quot;HS Code&quot; en la ficha del producto).">?</span>: <span class="data" style="color:var(--navy); font-weight:700;">${escHtml(p.codigo_hs)}</span></div>` : ""}
            <div class="prov-detail-precio-box">
              <div class="lbl">Precio FOB · ${escHtml(p.origen)}</div>
              <div class="val">${fmtFob(p)}</div>
            </div>
            <div class="prov-detail-actions">
              <a class="hub-btn-primary" style="text-align:center; text-decoration:none;" href="calculadora-importacion.html?nombre=${encodeURIComponent(p.nombre)}&categoria=${encodeURIComponent(p.categoria || "")}&codigoHS=${encodeURIComponent(p.codigo_hs || "")}&fob=${encodeURIComponent(p.precio_fob_min || "")}&origen=${encodeURIComponent(p.origen || "")}">Cotizar este producto →</a>
              <a class="hub-btn-ghost" style="text-align:center; text-decoration:none;" href="${linkWa(`Hola! Me interesa este producto del catálogo: ${p.nombre} (FOB ${fmtFob(p)}). ¿Me ayudan a importarlo?`)}" target="_blank">Consultar por WhatsApp</a>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const cont = document.getElementById("prov-content");
      const filtrados = productosFiltrados();
      const detalle = detalleAbierto ? productos.find((p) => p.id === detalleAbierto) : null;

      cont.innerHTML = `
        <div class="prov-head-actions">
          <button class="hub-btn-primary" data-action="ir-catalogo" type="button">Catálogo verificado</button>
          <button class="hub-btn-ghost" data-action="ir-solicitar" type="button">Solicitar producto</button>
        </div>

        <div class="prov-banner" id="prov-solicitar">
          <div>
            <div class="t">¿Buscás algo que no está acá?</div>
            <div class="d">Contanos qué querés importar o exportar y nuestro equipo te arma la operación completa.</div>
          </div>
          <div class="prov-banner-actions">
            <a class="btn-dark" href="${linkWa("Hola! Quiero importar un producto que no encontré en el catálogo verificado.")}" target="_blank">Quiero importar algo</a>
            <a class="btn-light" href="${linkWa("Hola! Quiero exportar un producto, ¿me pueden ayudar?")}" target="_blank">Quiero exportar algo</a>
          </div>
        </div>

        <div id="prov-catalogo">
          <div class="prov-toolbar">
            <input type="search" class="prov-search" id="prov-buscar" placeholder="Buscar producto, rubro…" value="${escHtml(busqueda)}" />
          </div>
          <div class="prov-pills" style="margin-bottom:18px;">
            ${categorias().map((c) => `<button class="prov-pill ${c === categoriaActiva ? "active" : ""}" data-cat="${escHtml(c)}" type="button">${escHtml(c)}</button>`).join("")}
          </div>
          ${!filtrados.length
            ? `<div class="prov-empty">No encontramos productos con ese filtro. Probá con otra búsqueda o <a href="#prov-solicitar" data-action="ir-solicitar">solicitá el producto</a>.</div>`
            : `<div class="prov-grid">${filtrados.map(renderTarjeta).join("")}</div>`}
        </div>

        ${renderDetalle(detalle)}
      `;

      const buscarInput = document.getElementById("prov-buscar");
      if (buscarInput) {
        buscarInput.addEventListener("input", (e) => {
          busqueda = e.target.value;
          const activo = document.activeElement === e.target;
          render();
          if (activo) {
            const el = document.getElementById("prov-buscar");
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          }
        });
      }

      cont.querySelectorAll("[data-cat]").forEach((btn) => {
        btn.addEventListener("click", () => { categoriaActiva = btn.getAttribute("data-cat"); render(); });
      });

      cont.querySelectorAll("[data-detalle]").forEach((card) => {
        card.addEventListener("click", () => { detalleAbierto = card.getAttribute("data-detalle"); render(); });
      });

      cont.querySelectorAll('[data-action="ir-solicitar"]').forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          document.getElementById("prov-solicitar").scrollIntoView({ behavior: "smooth", block: "center" });
        });
      });
      const irCatalogo = cont.querySelector('[data-action="ir-catalogo"]');
      if (irCatalogo) irCatalogo.addEventListener("click", () => {
        document.getElementById("prov-catalogo").scrollIntoView({ behavior: "smooth", block: "start" });
      });

      const closeBtn = document.getElementById("prov-detail-close");
      const overlay = document.getElementById("prov-detail-overlay");
      if (closeBtn) closeBtn.addEventListener("click", () => { detalleAbierto = null; render(); });
      if (overlay) overlay.addEventListener("click", (e) => { if (e.target === overlay) { detalleAbierto = null; render(); } });
    }

    await cargarProductos();
    render();
  })();
} catch (e) { console.error("proveedores verificados:", e); }
</script>
</body>
</html>
