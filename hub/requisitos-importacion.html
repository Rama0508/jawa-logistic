<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>¿Qué necesito para importar? — Portal de cliente — Jawa Logistic</title>
<meta name="description" content="¿Qué necesito para importar? — Portal de cliente de Jawa Logistic. Gestioná tu importación de punta a punta: cotizaciones, seguimiento y documentos." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 236 236'%3E%3Ccircle cx='118' cy='118' r='106' fill='%23ffffff' stroke='%2316223d' stroke-width='10'/%3E%3Crect x='88' y='88' width='60' height='60' fill='%23c9502e' transform='rotate(45 118 118)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
<link rel="stylesheet" href="../css/hub.css" />
</head>
<body>

<div id="hub-shell">
  <div id="hub-page">
    <p class="hub-page-lead">Contanos qué producto querés importar y te decimos, en general, qué papeles o permisos suele necesitar — así no te agarra de sorpresa en la aduana.</p>
    <div class="hub-card">
      <div class="requisitos-box">
        <div class="requisitos-form">
          <input type="text" id="req-input" placeholder="Ej: parlante bluetooth, casco de moto, crema facial…" />
          <button class="hub-btn-primary" id="req-btn" type="button">Analizar</button>
        </div>
        <div class="requisitos-hs-row">
          <label for="req-hs">¿Ya conocés el código HS/NCM? (opcional) <span class="hub-tooltip" tabindex="0" title="Es el código que clasifica tu producto ante la aduana argentina — de él depende qué arancel pagás y qué permisos necesitás. Pedíselo siempre a tu proveedor (en Alibaba, 1688, etc. suele figurar como &quot;HS Code&quot; en la ficha del producto). Si lo tenés, nos ayuda a afinar el análisis — si no, no importa.">?</span></label>
          <input type="text" id="req-hs" placeholder="Ej: 8517.62.00" />
        </div>
        <div id="req-resultado"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/rates.js"></script>
<script src="../js/cuenta.js"></script>
<script src="../js/hub.js"></script>
<script>
try {
  (async function () {
    const session = await iniciarHub("requisitos-importacion");
    if (!session) return;

    await SUPABASE_READY;

    const input = document.getElementById("req-input");
    const hsInput = document.getElementById("req-hs");
    const btn = document.getElementById("req-btn");
    const cont = document.getElementById("req-resultado");

    const REQUISITOS_URL = `${SUPABASE_URL}/functions/v1/requisitos-importacion`;
    const WA_NUMERO = "5493813312280";

    function badgeLabel(c) {
      return c === "alta" ? "Complejidad alta" : c === "media" ? "Complejidad media" : "Complejidad baja";
    }

    const ACEPTACION_INFO = {
      sin_restricciones_tipicas: { icono: "🟢", titulo: "Generalmente se puede importar", clase: "ok" },
      con_permisos_especiales: { icono: "🟡", titulo: "Necesita permisos o trámites especiales", clase: "permisos" },
      prohibido_o_muy_restringido: { icono: "🔴", titulo: "Prohibido o muy restringido — consultanos antes de comprar", clase: "prohibido" },
    };

    function renderResultado(a) {
      const mensajeWa = `Hola! Quiero importar: ${a.nombreProducto} (${a.categoria}). ¿Me ayudan con los trámites?`;
      const acept = ACEPTACION_INFO[a.estadoAceptacion] || null;
      cont.innerHTML = `
        <div class="requisitos-resultado">
          ${acept ? `
            <div class="requisitos-aceptacion requisitos-aceptacion-${acept.clase}">
              <span class="requisitos-aceptacion-icono">${acept.icono}</span>
              <div>
                <div class="requisitos-aceptacion-titulo">${acept.titulo}</div>
                ${a.notaAceptacion ? `<div class="requisitos-aceptacion-nota">${escHtml(a.notaAceptacion)}</div>` : ""}
              </div>
            </div>
          ` : ""}
          <div class="requisitos-resultado-head">
            <div class="requisitos-nombre">${escHtml(a.nombreProducto)}</div>
            <div class="requisitos-categoria">${escHtml(a.categoria)}</div>
            <span class="requisitos-badge requisitos-badge-${escHtml(a.complejidad)}">${badgeLabel(a.complejidad)}</span>
          </div>
          <p class="requisitos-resumen">${escHtml(a.resumen)}</p>
          ${a.fuenteSugerencia === "biblioteca_interna" && a.codigoHSSugerido ? `
            <p class="requisitos-sugerencia">💡 Ya confirmamos un código para un producto similar en una operación anterior: <b>${escHtml(a.codigoHSSugerido)}</b>. No es garantía de que aplique igual al tuyo, pero es una referencia real, no una estimación genérica.</p>
          ` : ""}
          <div class="requisitos-lista">
            ${(a.requisitos || []).map((r) => `
              <div class="requisitos-item">
                <div class="requisitos-item-organismo">${escHtml(r.organismo)}</div>
                <div class="requisitos-item-tramite">${escHtml(r.tramite)}</div>
                <div class="requisitos-item-detalle">${escHtml(r.detalle)}</div>
              </div>
            `).join("")}
          </div>
          <div class="requisitos-nota">⚠️ ${escHtml(a.advertencia || "Estimación orientativa — Jawa Logistic la confirma con despachante de aduana matriculado antes de tu operación.")}</div>
          <p class="requisitos-seguro">🛡️ Además, tu carga viaja asegurada: si algo se pierde o se daña en tránsito internacional, te cubrimos el valor declarado del envío.</p>
          <div class="requisitos-ctas">
            <a class="hub-btn-primary" style="text-decoration:none; display:inline-flex; align-items:center;" href="https://wa.me/${WA_NUMERO}?text=${encodeURIComponent(mensajeWa)}" target="_blank">Que Jawa se encargue de esto →</a>
            <a class="hub-btn-ghost" style="text-decoration:none; display:inline-flex; align-items:center;" href="calculadora-importacion.html">Cotizar este producto</a>
          </div>
        </div>
      `;
    }

    function renderError(msg) {
      cont.innerHTML = `
        <div class="requisitos-error">
          ${escHtml(msg)} <a href="https://wa.me/${WA_NUMERO}" target="_blank">Escribinos por WhatsApp →</a>
        </div>
      `;
    }

    async function analizar() {
      const descripcion = input.value.trim();
      if (!descripcion) { input.focus(); return; }
      btn.disabled = true;
      const textoOriginal = btn.textContent;
      btn.textContent = "Analizando…";
      cont.innerHTML = "";
      try {
        const codigoHS = hsInput ? hsInput.value.trim() : "";
        const resp = await fetch(REQUISITOS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + session.access_token },
          body: JSON.stringify({ descripcion, codigoHS }),
        });
        const data = await resp.json();
        if (!data.success) {
          renderError(data.error || "No pudimos analizar este producto. Escribinos por WhatsApp y te asesoramos directamente.");
        } else {
          renderResultado(data);
        }
      } catch (err) {
        renderError("No pudimos conectar con el análisis. Escribinos por WhatsApp y te asesoramos directamente.");
      } finally {
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    }

    btn.addEventListener("click", analizar);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") analizar(); });
  })();
} catch (e) { console.error("analizador de requisitos (hub):", e); }
</script>
</body>
</html>
