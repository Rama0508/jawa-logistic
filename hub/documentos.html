<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Documentos — Portal de cliente — Jawa Logistic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 236 236'%3E%3Ccircle cx='118' cy='118' r='106' fill='%23ffffff' stroke='%2316223d' stroke-width='10'/%3E%3Crect x='88' y='88' width='60' height='60' fill='%23c9502e' transform='rotate(45 118 118)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/hub.css" />
</head>
<body>

<div id="hub-shell">
  <div id="hub-page">
    <p class="hub-page-lead">Facturas, packing list y documentación aduanera de tus operaciones.</p>
    <div class="hub-card">
      <div class="hub-card-title">Tus documentos</div>
      <div id="documentos-lista"><p class="hub-empty">Cargando…</p></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/rates.js"></script>
<script src="../js/cuenta.js"></script>
<script src="../js/hub.js"></script>
<script>
const DOC_TIPO_LABEL = { factura: "Factura", packing_list: "Packing list", aduana: "Documentación aduanera", otro: "Otro" };

try {
  (async function () {
    await SUPABASE_READY;
    const session = await iniciarHub("documentos");
    if (!session) return;
    const clienteId = session.user.id;

    const cont = document.getElementById("documentos-lista");
    const { data, error } = await supabaseClient
      .from("documentos")
      .select("id, tipo, nombre_archivo, storage_path, creado_en")
      .eq("cliente_id", clienteId)
      .order("creado_en", { ascending: false });
    if (error) { cont.innerHTML = `<p class="hub-empty">Error: ${error.message}</p>`; return; }
    if (!data || !data.length) { cont.innerHTML = `<p class="hub-empty">Todavía no tenés documentos cargados.</p>`; return; }

    cont.innerHTML = data.map((d) => `
      <div class="hub-item">
        <div class="hub-item-head">
          <div>
            <div class="hub-item-title">${escHtml(d.nombre_archivo)}</div>
            <div class="hub-item-meta">${escHtml(DOC_TIPO_LABEL[d.tipo] || d.tipo)} · ${fmtFecha(d.creado_en)}</div>
          </div>
          <button class="hub-btn-ghost" data-descargar="${escHtml(d.storage_path)}">Descargar</button>
        </div>
      </div>
    `).join("");

    cont.querySelectorAll("[data-descargar]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Generando link…";
        const { data: url, error: urlError } = await supabaseClient.storage
          .from("documentos-cliente")
          .createSignedUrl(btn.dataset.descargar, 60);
        btn.disabled = false;
        btn.textContent = "Descargar";
        if (urlError || !url) { alert("No se pudo generar el link de descarga."); return; }
        window.open(url.signedUrl, "_blank");
      });
    });
  })();
} catch (e) { console.error("documentos hub:", e); }
</script>
</body>
</html>
